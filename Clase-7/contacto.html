    <main>
        <h1>Contacto</h1> 
        <h2>Escribinos si tenes dudas</h2>
        <form action="./contacto.html " method="post">
            <!-- 
            nombre
            telefono
            tamaño
            edad
            comentarios / sobre la mascota
            -->
            <label for="id-nombre">Nombre</label>
            <input type="text" name="nombre" id="id-nombre">
            <label for="id-telefono">Telefono</label>
            <input type="tel" name="telefono" id="id-telefono">
            <label for="id-tamaño-mascota">Tamaño de mascota</label>
            <select name="tamaño-mascota" id="id-tamaño-mascota">
                <option value="C">Chico</option>
                <option value="M">Mediano</option>
                <option value="G">Grande</option>
            </select>
            <label for="id-edad">Edad</label>
            <input type="number" name="edad" id="id-edad">

            <label for="id-comentario">Comentario sobre la mascota</label>
            <textarea name="comentario" id="id-comentario"></textarea>

            <!-- -- -->
             <button type="reset">
                Limpiar
             </button>
             <!-- <input type="submit"> -->
             <button type="submit"> 
                Enviar
             </button>

        </form>
